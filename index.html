<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Domain Desk</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#0a0b0d;--card:#121418;--line:#1f232a;--fg:#eceef1;--m:#8b939d;--g:#2bd576;--y:#f5b941;--r:#ff5d5d;--b:#5aa2ff;--p:#b17cff;--o:#ff8f3a}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 -apple-system,"Inter","Segoe UI",sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 2px}.sub{color:var(--m);font-size:13px;margin:0 0 14px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 12px;padding:0 16px}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;padding:8px 12px;cursor:pointer;text-align:left;font:inherit}
.chip b{display:block;font-size:20px;line-height:1.1}.chip span{font-size:12px;color:var(--m)}.chip.on{border-color:var(--fg)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.seg{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:none;color:var(--m);padding:8px;border-radius:9px;font:600 14px inherit;cursor:pointer}.seg button.on{background:var(--fg);color:#000}
.bar{display:flex;gap:8px;margin-bottom:12px}
input,textarea{width:100%;background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:10px;padding:10px 12px;font:inherit}
.btn{border:0;background:var(--g);color:#04130a;font-weight:700;border-radius:10px;padding:10px 14px;cursor:pointer;font:inherit;font-weight:700;white-space:nowrap}
.btn.ghost{background:var(--card);color:var(--fg);border:1px solid var(--line)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin:4px 0 8px}.cal-h b{font-size:17px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:11px;color:var(--m);text-align:center;padding:4px 0}
.day{min-height:78px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px;overflow:hidden}
.day.out{opacity:.35}.day.today{border-color:var(--g)}
.day .n{font-size:11px;color:var(--m)}
.pill{display:block;font-size:11px;border-radius:5px;padding:1px 4px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;background:#1a1e25}
.more{font-size:11px;color:var(--m);cursor:pointer}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer}
.row .d{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}.row .w{font-size:12px;color:var(--m);text-align:right;white-space:nowrap}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;white-space:nowrap}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.sheet{background:#111317;border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:86vh;overflow:auto;padding:18px 16px 28px}
.sheet h2{margin:0 0 4px;font-size:20px;word-break:break-all}.kv{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;font-size:14px;margin:12px 0}.kv span:nth-child(odd){color:var(--m)}
.links{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}.links a{font-size:13px;color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 10px;text-decoration:none}
.res{white-space:pre-wrap;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px}
.muted{color:var(--m);font-size:13px}.xa{font-size:12px;font-weight:500;color:var(--b);text-decoration:none}.empty{color:var(--m);text-align:center;padding:30px}
@media(min-width:800px){.ov{align-items:center}.sheet{border-radius:16px}.day{min-height:96px}}
</style>
</head>
<body><main>
<h1>Domain Desk</h1>
<p class="sub" id="sub">Loading…</p>
<div class="chips" id="chips"></div>
<div class="seg" id="view"><button data-v="cal" class="on">Calendar</button><button data-v="list">List</button><button data-v="add">Add / research</button></div>
<div class="bar" id="sbar"><input id="q" placeholder="Search domains" autocomplete="off"></div>
<div id="body"></div>
</main>
<script>
const API="https://mdggkjocllyqxpthvtop.supabase.co/functions/v1/domain-desk";
const PH={available:["Available now","var(--g)"],pending_delete:["Pending delete","var(--r)"],redemption:["Redemption","var(--o)"],grace:["Expired · auction window","var(--p)"],expiring:["Expires ≤30 days","var(--y)"],active:["Active","var(--b)"],unknown:["No date","var(--m)"],queued:["Checking…","var(--m)"]};
const ORDER=["available","pending_delete","redemption","grace","expiring","active","unknown","queued"];
let ROWS=[],view=lsGet("dd_view","cal"),filt=lsGet("dd_f",""),srt=(v=>v==="price"?"x":v)(lsGet("dd_srt","x")),mo=new Date();mo.setDate(1);
function lsGet(k,d){try{return localStorage.getItem(k)??d}catch(_){return d}}function lsSet(k,v){try{localStorage.setItem(k,v)}catch(_){}}
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const days=e=>e?Math.floor((Date.parse(e)-Date.now())/864e5):null;
const when=r=>r.phase==="available"?"register now":r.exp?(days(r.exp)<0?`expired ${-days(r.exp)}d ago`:`${days(r.exp)}d · ${r.exp.slice(0,10)}`):"–";
async function load(){
  const pass=lsGet("dd_pw","");if(!pass)return gate();
  try{const j=await fetch(API+"?a=list",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pass})}).then(r=>r.json());if(j.error==="pass")return gate(true);ROWS=j.rows||[];
  $("#sub").textContent=`${ROWS.length.toLocaleString()} domains watched · ${ROWS.filter(r=>r.checked_at).length.toLocaleString()} checked · updated ${new Date(j.at).toLocaleTimeString()}`;}catch(e){$("#sub").textContent="Could not load. Retrying…"}
  paint();
}
function gate(bad){$("#sub").textContent="Private. Enter the passcode.";$("#chips").innerHTML="";$("#body").innerHTML=`<div class="list" style="max-width:360px"><input id="gp" type="password" placeholder="Passcode" autocomplete="current-password">${bad?'<p class="muted" style="color:var(--r)">Wrong passcode.</p>':""}<button class="btn" id="gpb">Open</button></div>`;$("#gpb").onclick=()=>{lsSet("dd_pw",$("#gp").value.trim());load()};$("#gp").onkeydown=e=>{if(e.key==="Enter")$("#gpb").click()}}
const xl=r=>(r.x||[]).length?`<a class="xa" target="_blank" rel="noopener" href="https://x.com/${encodeURIComponent(r.x[0].u)}" onclick="event.stopPropagation()">@${esc(r.x[0].u)}${r.x.length>1?` +${r.x.length-1}`:""}</a>`:"";
function counts(){const c={};for(const r of ROWS)c[r.phase]=(c[r.phase]||0)+1;c.mine=ROWS.filter(r=>r.source==="mine").length;c.availx=ROWS.filter(r=>r.phase==="available"&&(r.x||[]).length).length;c.hasx=ROWS.filter(r=>(r.x||[]).length).length;return c}
function chips(){const c=counts();
  $("#chips").innerHTML=[["","All",ROWS.length,"var(--fg)"],...ORDER.filter(k=>c[k]).map(k=>[k,PH[k][0],c[k],PH[k][1]]),["availx","Available + X",c.availx,"var(--g)"],["hasx","Has X account",c.hasx,"var(--b)"],["mine","My domains",c.mine,"var(--g)"]].map(([k,l,n,col])=>`<button class="chip${filt===k?" on":""}" data-f="${k}"><b>${(n||0).toLocaleString()}</b><span><i class="dot" style="background:${col}"></i>${l}</span></button>`).join("");}
function rowsF(){const q=$("#q").value.trim().toLowerCase();const ph=r=>!filt||(filt==="mine"?r.source==="mine":filt==="availx"?r.phase==="available"&&(r.x||[]).length>0:filt==="hasx"?(r.x||[]).length>0:r.phase===filt);const mq=r=>!q||r.domain.includes(q)||(r.x||[]).some(x=>x.u.toLowerCase().includes(q));return ROWS.filter(r=>ph(r)&&mq(r))}
function paint(){chips();$$("#view button").forEach(b=>b.classList.toggle("on",b.dataset.v===view));$("#sbar").style.display=view==="add"?"none":"";
  if(view==="cal")cal();else if(view==="list")list();else addView()}
function $$(s){return[...document.querySelectorAll(s)]}
function cal(){const rs=rowsF().filter(r=>r.exp),by={};for(const r of rs){const k=r.exp.slice(0,10);(by[k]=by[k]||[]).push(r)}
  const y=mo.getFullYear(),m=mo.getMonth(),start=new Date(y,m,1),off=(start.getDay()+6)%7,first=new Date(y,m,1-off),today=new Date().toISOString().slice(0,10);
  let h=`<div class="cal-h"><button class="btn ghost" data-m="-1">‹</button><b>${start.toLocaleString("en",{month:"long",year:"numeric"})}</b><button class="btn ghost" data-m="1">›</button></div><div class="cal">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("")}`;
  for(let i=0;i<42;i++){const d=new Date(first);d.setDate(first.getDate()+i);const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`,L=(by[k]||[]).sort((a,b)=>(b.source==="mine")-(a.source==="mine"));
    h+=`<div class="day${d.getMonth()!==m?" out":""}${k===today?" today":""}"><div class="n">${d.getDate()}</div>${L.slice(0,3).map(r=>`<span class="pill" data-d="${esc(r.domain)}" style="border-left:3px solid ${PH[r.phase][1]}">${r.source==="mine"?"🏠 ":""}${esc(r.domain)}</span>`).join("")}${L.length>3?`<div class="more" data-day="${k}">+${L.length-3} more</div>`:""}</div>`}
  const noDate=rowsF().filter(r=>!r.exp&&r.phase!=="queued");
  h+=`</div>${noDate.length?`<p class="muted" style="margin-top:14px">${noDate.length} without an expiry date (available now or unknown): see List.</p>`:""}`;$("#body").innerHTML=h}
function list(day){let rs=day?rowsF().filter(r=>r.exp&&r.exp.startsWith(day)):rowsF();
  const byPh=(a,b)=>ORDER.indexOf(a.phase)-ORDER.indexOf(b.phase)||(a.exp?Date.parse(a.exp):9e15)-(b.exp?Date.parse(b.exp):9e15);const xn=r=>(r.x||[]).length?1:0,pr=r=>r.price==null?-1:+r.price,fo=r=>(r.x&&r.x[0]&&r.x[0].f)||0;
  rs.sort(srt==="phase"?byPh:srt==="price"?((a,b)=>pr(b)-pr(a)||byPh(a,b)):((a,b)=>xn(b)-xn(a)||pr(b)-pr(a)||byPh(a,b)||fo(b)-fo(a)));
  const n=rs.length;rs=rs.slice(0,600);
  $("#body").innerHTML=(day?`<p class="muted">Expiring on ${day} <a href="#" data-back style="color:var(--g)">back</a></p>`:"")+`<div style="display:flex;gap:8px;align-items:center;margin:0 0 10px"><span class="muted">Sort</span><select id="srt" style="width:auto">${[["x","X linked first"],["phase","Phase and expiry date"]].map(([k,l])=>`<option value="${k}"${srt===k?" selected":""}>${l}</option>`).join("")}</select></div>`+(n?`<div class="list">${rs.map(r=>`<div class="row" data-d="${esc(r.domain)}"><i class="dot" style="background:${PH[r.phase][1]}"></i><div class="d">${r.source==="mine"?"🏠 ":""}${esc(r.domain)}<div>${xl(r)}</div></div><span class="tag" style="background:${PH[r.phase][1]}22;color:${PH[r.phase][1]}">${PH[r.phase][0]}</span><div class="w">${r.price!=null?`<b style="color:var(--g)">$${Math.round(r.price).toLocaleString()}</b> · `:""}${when(r)}</div></div>`).join("")}</div>${n>600?`<p class="muted">Showing 600 of ${n}. Search to narrow.</p>`:""}`:`<div class="empty">Nothing here yet.</div>`)}
function addView(){$("#body").innerHTML=`<div class="list">
  <label class="muted">Passcode (sent to your Telegram alerts)<input id="pw" type="password" value="${esc(lsGet("dd_pw",""))}" autocomplete="off"></label>
  <label class="muted">Domains to watch (one per line, or paste links)<textarea id="ad" rows="6" placeholder="example.com&#10;https://another.xyz/page"></textarea></label>
  <label class="muted"><input type="checkbox" id="mine" style="width:auto"> These are my domains (renewal reminders)</label>
  <button class="btn" id="addb">Add to watcher</button><p class="muted" id="addm"></p>
  <label class="muted">Research one domain with Claude<input id="rd" placeholder="domain.com"></label>
  <button class="btn ghost" id="resb">Research</button><div id="resm"></div></div>`}
async function post(a,b){const pass=($("#pw")?.value||lsGet("dd_pw","")).trim();lsSet("dd_pw",pass);const r=await fetch(`${API}?a=${a}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({pass,...b})});return r.json()}
function sheet(d){const r=ROWS.find(x=>x.domain===d)||{domain:d,phase:"queued"};const ov=document.createElement("div");ov.className="ov";
  const name=d.split(".")[0];
  ov.innerHTML=`<div class="sheet"><h2>${esc(d)}</h2><span class="tag" style="background:${PH[r.phase][1]}22;color:${PH[r.phase][1]}">${PH[r.phase][0]}</span>
  <div class="kv"><span>Expires</span><span>${r.exp?r.exp.slice(0,16).replace("T"," ")+" UTC ("+when(r)+")":"–"}</span><span>Status</span><span>${esc((r.status||[]).join(", ")||"–")}</span><span>Registrar</span><span>${esc(r.registrar||"–")}</span><span>Source</span><span>${esc(r.source||"–")}</span><span>X accounts</span><span>${(r.x||[]).length?r.x.map(x=>`<a style="color:var(--b)" target="_blank" rel="noopener" href="https://x.com/${encodeURIComponent(x.u)}">@${esc(x.u)}</a> <span class="muted">${x.f!=null?x.f.toLocaleString()+" followers":"from their website"}</span>`).join("<br>"):"–"}</span><span>Last check</span><span>${r.checked_at?new Date(r.checked_at).toLocaleString():"–"}</span></div>
  <p class="muted">${r.phase==="grace"?"Expired: the registrar can still renew it for the owner, and many registrars put names like this into their own expired-domain auction (GoDaddy, Namecheap, Dynadot) about 3 to 5 weeks after expiry.":r.phase==="redemption"?"Redemption: only the old owner can restore it (about 30 days). Next it goes to pending delete, then it drops.":r.phase==="pending_delete"?"Pending delete: it drops within about 5 days. Drop-catch services (DropCatch, SnapNames, NameJet) race to register it the second it is released. You also get a Telegram alert the moment it is free.":r.phase==="available"?"Not registered right now: you can register it directly.":""}</p>
  <div class="links"><a target="_blank" rel="noopener" href="https://www.namecheap.com/domains/registration/results/?domain=${encodeURIComponent(d)}">Namecheap</a><a target="_blank" rel="noopener" href="https://auctions.godaddy.com/beta?query=${encodeURIComponent(name)}">GoDaddy auctions</a><a target="_blank" rel="noopener" href="https://www.dropcatch.com/search?q=${encodeURIComponent(d)}">DropCatch</a><a target="_blank" rel="noopener" href="https://www.expireddomains.net/domain-name-search/?q=${encodeURIComponent(name)}">ExpiredDomains</a><a target="_blank" rel="noopener" href="https://web.archive.org/web/*/${encodeURIComponent(d)}">Archive</a><a target="_blank" rel="noopener" href="https://${encodeURIComponent(d)}">Open site</a></div>
  ${r.research?`<div class="res">${esc(r.research)}</div>`:""}<div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-res="${esc(d)}">${r.research?"Research again":"Research with Claude"}</button><button class="btn ghost" data-close>Close</button></div><div id="sres"></div></div>`;
  ov.onclick=async e=>{if(e.target===ov||e.target.closest("[data-close]"))return ov.remove();const b=e.target.closest("[data-res]");if(b){b.disabled=true;b.textContent="Researching…";const j=await post("research",{domain:d});if(j.research){r.research=j.research;ov.remove();sheet(d)}else{$("#sres").innerHTML=`<p class="muted">${j.error==="pass"?"Enter the passcode under Add / research first.":"Could not research right now."}</p>`;b.disabled=false;b.textContent="Research with Claude"}}};
  document.body.append(ov)}
document.addEventListener("change",e=>{if(e.target.id==="srt"){srt=e.target.value;lsSet("dd_srt",srt);list()}});
document.addEventListener("click",async e=>{
  const f=e.target.closest("[data-f]");if(f){filt=f.dataset.f;lsSet("dd_f",filt);return paint()}
  const v=e.target.closest("[data-v]");if(v){view=v.dataset.v;lsSet("dd_view",view);return paint()}
  const m=e.target.closest("[data-m]");if(m){mo.setMonth(mo.getMonth()+Number(m.dataset.m));return cal()}
  const dd=e.target.closest("[data-d]");if(dd&&!e.target.closest(".ov"))return sheet(dd.dataset.d);
  const day=e.target.closest("[data-day]");if(day)return list(day.dataset.day);
  if(e.target.closest("[data-back]")){e.preventDefault();return cal()}
  if(e.target.id==="addb"){const t=$("#ad").value;const j=await post("add",{domains:t,mine:$("#mine").checked});$("#addm").textContent=j.added?`Added ${j.added}. They are checked within a few minutes.`:j.error==="pass"?"Wrong passcode.":"Nothing added: "+(j.error||"");if(j.added)setTimeout(load,4000)}
  if(e.target.id==="resb"){const d=$("#rd").value.trim();if(!d)return;$("#resm").innerHTML='<p class="muted">Researching…</p>';const j=await post("research",{domain:d});$("#resm").innerHTML=j.research?`<div class="res">${esc(j.research)}</div>`:`<p class="muted">${j.error==="pass"?"Wrong passcode.":"Could not research right now."}</p>`;if(j.research)load()}
});
$("#q").oninput=()=>view==="cal"?cal():list();
load();setInterval(()=>document.visibilityState==="visible"&&load(),60000);
</script>
</body></html>
