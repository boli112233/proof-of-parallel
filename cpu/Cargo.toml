[package]
name = "dag-sigverify-cpu"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "CPU baseline: verify Solana-style ed25519 signatures (single, batch, all cores)"

[dependencies]
ed25519-dalek = { version = "2.1", features = ["batch", "rand_core"] }
rand = "0.8"
rayon = "1.10"
serde_json = "1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
